name: Model tests

on:
  pull_request:
  push:
    branches:
      - main
      - codex/lajcb-r2-smm

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run model tests
        run: npm test
