name: Apply synchronized R1 checkpoint

on:
  push:
    branches:
      - codex/lajcb-r2-smm

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: codex/lajcb-r2-smm
          fetch-depth: 0

      - name: Reassemble and apply R1 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .r1-sync/chunk_*.b64 > /tmp/global_slack_r1_sync.tar.gz.b64
          base64 --decode /tmp/global_slack_r1_sync.tar.gz.b64 > /tmp/global_slack_r1_sync.tar.gz
          echo "727a6891b5e990420206eaccf3e940d85ba252f9b643d06bcd9e5b0a4ef03570  /tmp/global_slack_r1_sync.tar.gz" | sha256sum --check
          tar -xzf /tmp/global_slack_r1_sync.tar.gz -C .
          rm -rf .r1-sync
          rm -f .github/workflows/apply-r1-sync.yml

      - name: Validate synchronized code
        run: npm test

      - name: Commit synchronized checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize R1 zeta notation, setup, and output register"
          git push origin HEAD:codex/lajcb-r2-smm
