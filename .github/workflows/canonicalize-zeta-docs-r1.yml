name: Canonicalize R1 zeta documentation

on:
  push:
    branches:
      - codex/lajcb-r2-smm
    paths:
      - .github/workflows/canonicalize-zeta-docs-r1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the R1 branch
        uses: actions/checkout@v4
        with:
          ref: codex/lajcb-r2-smm
          fetch-depth: 0

      - name: Remove retired code aliases from documentation
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path("AGENTS.md"),
              Path("README.md"),
              Path("docs/MODEL_EXTENSION.md"),
              Path("docs/NOTATION_CROSSWALK.md"),
              Path("docs/DEMAND_WEDGE_NORMALIZATION.md"),
              Path("docs/ZETA_EULER_WEDGE_R1.md"),
              Path("docs/PROJECT_LOG.md"),
              Path("docs/DECISIONS.md"),
              Path("docs/SMM_DESIGN.md"),
              Path("docs/REVISION_ROADMAP.md"),
              Path("smm/README.md"),
          ]

          token_replacements = [
              ("`corrddstar`", "`corrzetazetastar`"),
              ("`deltadstar`", "`deltazetastar`"),
              ("`deltad`", "`deltazeta`"),
              ("`stddstar`", "`stdzetastar`"),
              ("`stdd`", "`stdzeta`"),
              ("`eps_dstar`", "`eps_zetastar`"),
              ("`eps_d`", "`eps_zeta`"),
              ("`dstar`", "`zetastar`"),
              ("`d`", "`zeta`"),
          ]

          exact_replacements = {
              "The JavaScript state names `d` and `dstar` are internal implementation names only and map to the manuscript objects `zeta_t` and `zeta*_t`.":
              "The manuscript and executable code use the canonical identifiers `zeta` and `zetastar`; no `d`/`dstar` compatibility aliases remain.",
              "Code states `d` and `dstar` map to the manuscript Euler":
              "Code states `zeta` and `zetastar` are the manuscript Euler",
              "The internal JavaScript state names `d` and `dstar` are retained solely for backward compatibility with the existing interface and tests.":
              "The JavaScript state names are `zeta` and `zetastar`, matching the manuscript notation directly; no legacy aliases are retained.",
          }

          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in exact_replacements.items():
                  text = text.replace(old, new)
              for old, new in token_replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          crosswalk = Path("docs/NOTATION_CROSSWALK.md")
          if crosswalk.exists():
              text = crosswalk.read_text(encoding="utf-8")
              note = (
                  "\n> **R1 canonical naming rule.** The manuscript, JavaScript solver, "
                  "simulation code, tests, exports, and SMM configuration all use `zeta` "
                  "and `zetastar`. Legacy executable aliases `d` and `dstar` are prohibited.\n"
              )
              if "R1 canonical naming rule" not in text:
                  lines = text.splitlines()
                  insert_at = 1 if lines and lines[0].startswith("#") else 0
                  lines.insert(insert_at, note)
                  text = "\n".join(lines) + "\n"
              crosswalk.write_text(text, encoding="utf-8")

      - name: Verify executable names and documentation aliases
        shell: python
        run: |
          from pathlib import Path
          import re

          executable = [
              Path("model/parameters.js"), Path("model/system.js"),
              Path("model/simulation.js"), Path("model/ui.js"),
              Path("revision-ui.js"), Path("tests/model.test.js"), Path("model.js")
          ]
          patterns = [
              r"\beps_d\b", r"\beps_dstar\b", r"\bdeltad\b",
              r"\bdeltadstar\b", r"\bstdd\b", r"\bstddstar\b",
              r"\bcorrddstar\b", r'([\"\'])d\1', r'([\"\'])dstar\1'
          ]
          failures = []
          for path in executable:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  if re.search(pattern, text):
                      failures.append(f"{path}: {pattern}")
          if failures:
              raise SystemExit("Retired executable identifiers remain:\n" + "\n".join(failures))

      - name: Run model tests
        run: npm test

      - name: Commit documentation migration
        run: |
          if git diff --quiet; then
            echo "No documentation migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md docs smm/README.md
          git commit -m "Align R1 documentation with canonical zeta state names"
          git push origin HEAD:codex/lajcb-r2-smm
