name: Canonicalize R1 Euler-wedge names

on:
  push:
    branches:
      - codex/lajcb-r2-smm
    paths:
      - .github/workflows/canonicalize-zeta-r1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the R1 branch
        uses: actions/checkout@v4
        with:
          ref: codex/lajcb-r2-smm
          fetch-depth: 0

      - name: Replace retired d/dstar identifiers with zeta/zetastar
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = [
              Path("model/parameters.js"),
              Path("model/system.js"),
              Path("model/simulation.js"),
              Path("model/ui.js"),
              Path("revision-ui.js"),
              Path("tests/model.test.js"),
              Path("model.js"),
          ]

          replacements = [
              ("corrddstar", "corrzetazetastar"),
              ("deltadstar", "deltazetastar"),
              ("deltad", "deltazeta"),
              ("stddstar", "stdzetastar"),
              ("stdd", "stdzeta"),
              ("eps_dstar", "eps_zetastar"),
              ("eps_d", "eps_zeta"),
          ]

          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  text = text.replace(old, new)
              text = re.sub(r"\bdstar\b", "zetastar", text)
              text = re.sub(r'([\"\'])d\1', lambda m: m.group(1) + "zeta" + m.group(1), text)
              text = re.sub(r"\.d\b", ".zeta", text)
              text = re.sub(r"\bd\s*:", "zeta:", text)
              text = text.replace("Home demand shock process", "Home Euler/aggregate-demand wedge")
              text = text.replace("Foreign demand shock process", "Foreign Euler/aggregate-demand wedge")
              path.write_text(text, encoding="utf-8")

      - name: Verify that retired executable identifiers are gone
        shell: python
        run: |
          from pathlib import Path
          import re

          patterns = [
              r"\beps_d\b", r"\beps_dstar\b",
              r"\bdeltad\b", r"\bdeltadstar\b",
              r"\bstdd\b", r"\bstddstar\b",
              r"\bcorrddstar\b", r'([\"\'])d\1', r'([\"\'])dstar\1'
          ]
          failures = []
          for path in [
              Path("model/parameters.js"), Path("model/system.js"),
              Path("model/simulation.js"), Path("model/ui.js"),
              Path("revision-ui.js"), Path("tests/model.test.js"), Path("model.js")
          ]:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  if re.search(pattern, text):
                      failures.append(f"{path}: {pattern}")
          if failures:
              raise SystemExit("Retired identifiers remain:\n" + "\n".join(failures))

      - name: Run model tests
        run: npm test

      - name: Commit canonical naming migration
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model model.js revision-ui.js tests/model.test.js
          git commit -m "Canonicalize R1 Euler wedges as zeta and zetastar"
          git push origin HEAD:codex/lajcb-r2-smm
